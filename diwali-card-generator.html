<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali Wish Card Generator - Wishes Hub India</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Great+Vibes&display=swap');
body{margin:0;font-family:'Poppins',sans-serif;background:#FFF8F0;min-height:100vh}
.header{background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b);padding:14px 16px;color:white;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;margin:0;font-weight:700}
.card-wrap{padding:16px;max-width:480px;margin:0 auto}
.preview-box{width:100%;aspect-ratio:4/5;background:linear-gradient(180deg,#2d1b4e,#ff6b35);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 20px 40px rgba(0,0,0,0.2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;border:4px solid #fbbf24}
.photo-ring{width:140px;height:140px;border-radius:50%;border:4px solid #fbbf24;background:#fff;overflow:hidden;box-shadow:0 0 20px rgba(251,191,36,0.8);margin-bottom:16px;position:relative}
.photo-ring img{width:100%;height:100%;object-fit:cover}
.wish-text{font-family:'Great Vibes',cursive;font-size:38px;color:#fde68a;text-align:center;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
.controls{background:white;border-radius:20px;padding:16px;margin-top:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
.input{width:100%;padding:12px;border:2px solid #f3f4f6;border-radius:12px;font-size:15px;box-sizing:border-box;outline:none}
.input:focus{border-color:#ec4899}
.templates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tpl{min-width:90px;padding:10px;border-radius:12px;border:2px solid #e5e7eb;text-align:center;font-size:12px;font-weight:600;cursor:pointer}
.tpl.active{border-color:#f59e0b;background:#fffbeb;color:#92400e}
.btn{width:100%;padding:15px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-gold{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#000}
.btn-wa{background:white;border:2px solid #fbbf24;color:#92400e}
.upload-btn{background:#f3f4f6;border:2px dashed #d1d5db;padding:12px;border-radius:12px;text-align:center;cursor:pointer;font-size:13px}
canvas{display:none}
</style>
</head>
<body>
<div class="header"><span onclick="location.href='/'">←</span><h1>Wishes Hub India</h1><span>✨</span></div>
<div class="card-wrap">
<div class="preview-box" id="previewBox">
<div class="photo-ring"><img id="previewImg" src="https://i.pravatar.cc/200" alt=""></div>
<div class="wish-text" id="wishDisplay">Happy Diwali</div>
<div class="wish-text" style="font-size:28px" id="nameDisplay">from Raju</div>
<div style="font-size:11px;color:#fde68a;text-align:center;margin-top:12px;">May this Diwali bring joy, prosperity & happiness<br>to you & your family!</div>
</div>
<div class="controls">
<div style="margin-bottom:14px"><label class="label">👤 Apna Naam Likho</label><input class="input" id="nameInput" placeholder="Jaise: Raju" value="Raju" oninput="updateCard()"></div>
<div style="margin-bottom:14px"><label class="label">📸 Apni Photo Lagao</label><div class="upload-btn" onclick="document.getElementById('fileIn').click()">📁 Photo Choose Karo</div><input type="file" id="fileIn" accept="image/*" style="display:none" onchange="loadPhoto(event)"></div>
<div style="margin-bottom:14px"><label class="label">🎨 Template</label><div class="templates"><div class="tpl active" onclick="setTpl(this,'gold')">🪔 Golden Diya</div><div class="tpl" onclick="setTpl(this,'rangoli')">🌸 Rangoli</div><div class="tpl" onclick="setTpl(this,'lantern')">🏮 Lanterns</div></div></div>
<button class="btn btn-gold" onclick="downloadCard()">⬇️ Download Card</button>
<button class="btn btn-wa" onclick="shareWA()">📤 Share to WhatsApp</button>
</div>
</div>
<canvas id="canvas" width="1080" height="1350"></canvas>
<script>
let currentTpl='gold';
function updateCard(){let name=document.getElementById('nameInput').value||'Raju';document.getElementById('nameDisplay').innerText='from '+name;}
function loadPhoto(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){document.getElementById('previewImg').src=ev.target.result;};r.readAsDataURL(file);}
function setTpl(el,tpl){document.querySelectorAll('.tpl').forEach(x=>x.classList.remove('active'));el.classList.add('active');currentTpl=tpl;let box=document.getElementById('previewBox');if(tpl==='gold')box.style.background='linear-gradient(180deg,#2d1b4e,#ff6b35)';if(tpl==='rangoli')box.style.background='linear-gradient(180deg,#831843,#be185d,#f43f5e)';if(tpl==='lantern')box.style.background='linear-gradient(180deg,#064e3b,#059669)';}
function downloadCard(){let canvas=document.getElementById('canvas');let ctx=canvas.getContext('2d');let grad=ctx.createLinearGradient(0,0,0,1350);if(currentTpl==='gold'){grad.addColorStop(0,'#2d1b4e');grad.addColorStop(1,'#ff6b35');}if(currentTpl==='rangoli'){grad.addColorStop(0,'#831843');grad.addColorStop(1,'#f43f5e');}if(currentTpl==='lantern'){grad.addColorStop(0,'#064e3b');grad.addColorStop(1,'#059669');}ctx.fillStyle=grad;ctx.fillRect(0,0,1080,1350);ctx.strokeStyle='#fbbf24';ctx.lineWidth=12;ctx.strokeRect(20,20,1040,1310);ctx.fillStyle='#fbbf24';for(let i=0;i<30;i++){ctx.beginPath();ctx.arc(Math.random()*1080,Math.random()*1350,3,0,Math.PI*2);ctx.fill();}let img=document.getElementById('previewImg');let sx=540,sy=400,r=160;ctx.save();ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.clip();ctx.drawImage(img,sx-r,sy-r,r*2,r*2);ctx.restore();ctx.strokeStyle='#fbbf24';ctx.lineWidth=8;ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.stroke();let name=document.getElementById('nameInput').value||'Raju';ctx.fillStyle='#fde68a';ctx.font='bold 90px Great Vibes';ctx.textAlign='center';ctx.fillText('Happy Diwali',540,780);ctx.font='bold 60px Great Vibes';ctx.fillText('from '+name,540,860);ctx.fillStyle='white';ctx.font='22px Poppins';ctx.fillText('May this Diwali bring joy, prosperity & happiness',540,950);ctx.fillText('to you & your family!',540,980);ctx.fillStyle='#fbbf24';ctx.font='bold 24px Poppins';ctx.fillText('Wishes Hub India 🇮🇳',540,1280);let link=document.createElement('a');link.download='diwali-wish-'+name+'.png';link.href=canvas.toDataURL();link.click();}
function shareWA(){downloadCard(); setTimeout(()=>{let name=document.getElementById('nameInput').value||'Raju';window.open('https://wa.me/?text='+encodeURIComponent('Maine apna Diwali Card banaya hai Wishes Hub India pe 🪔 - '+name+' ki taraf se! Check karo: https://wishes-hub-india.vercel.app/diwali-card-generator.html'));},500);}
</script>
</body>
</html>
